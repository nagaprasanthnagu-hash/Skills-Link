<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="heroIllustrationTitle">
  <title id="heroIllustrationTitle">A bright, modern living room</title>

  <!-- Background -->
  <rect width="640" height="480" fill="#EEF1FB"/>
  <!-- Wall / floor split -->
  <rect x="0" y="0" width="640" height="330" fill="#F5F6FC"/>
  <rect x="0" y="330" width="640" height="150" fill="#E4E9FA"/>

  <!-- Wall art -->
  <rect x="70" y="70" width="90" height="110" rx="6" fill="#FFFFFF" stroke="#D8DEF7" stroke-width="3"/>
  <rect x="90" y="95" width="50" height="60" rx="3" fill="#C7D2F7"/>
  <rect x="180" y="90" width="70" height="90" rx="6" fill="#FFFFFF" stroke="#D8DEF7" stroke-width="3"/>
  <circle cx="215" cy="130" r="24" fill="#DCE3FA"/>

  <!-- Window -->
  <rect x="470" y="60" width="130" height="150" rx="8" fill="#FFFFFF" stroke="#D8DEF7" stroke-width="4"/>
  <line x1="535" y1="60" x2="535" y2="210" stroke="#D8DEF7" stroke-width="4"/>
  <line x1="470" y1="135" x2="600" y2="135" stroke="#D8DEF7" stroke-width="4"/>

  <!-- Floor lamp -->
  <rect x="447" y="180" width="6" height="150" fill="#B9C2E0"/>
  <ellipse cx="450" cy="180" rx="4" ry="4" fill="#B9C2E0"/>
  <path d="M410 130 L490 130 L470 175 L430 175 Z" fill="#FBBF24"/>
  <ellipse cx="450" cy="330" rx="26" ry="7" fill="#B9C2E0"/>

  <!-- Side table -->
  <rect x="500" y="290" width="80" height="12" rx="4" fill="#FFFFFF" stroke="#D8DEF7" stroke-width="3"/>
  <line x1="512" y1="302" x2="512" y2="340" stroke="#D8DEF7" stroke-width="4"/>
  <line x1="568" y1="302" x2="568" y2="340" stroke="#D8DEF7" stroke-width="4"/>
  <ellipse cx="540" cy="285" rx="18" ry="10" fill="#9DB0F5"/>

  <!-- Plant -->
  <path d="M70 340 L110 340 L104 380 L76 380 Z" fill="#7C4FE0"/>
  <path d="M90 340 C 60 320, 50 270, 70 240 C 80 275, 88 300, 90 340 Z" fill="#34D399"/>
  <path d="M90 340 C 120 315, 130 270, 112 235 C 100 270, 92 300, 90 340 Z" fill="#22C3B6"/>
  <path d="M90 340 C 88 305, 92 270, 90 235 C 78 270, 82 305, 90 340 Z" fill="#5FD9A4"/>

  <!-- Rug -->
  <ellipse cx="300" cy="430" rx="230" ry="30" fill="#DCE3FA"/>

  <!-- Sofa -->
  <rect x="120" y="270" width="320" height="110" rx="26" fill="#B9C6F2"/>
  <rect x="108" y="300" width="40" height="90" rx="18" fill="#A6B6ED"/>
  <rect x="412" y="300" width="40" height="90" rx="18" fill="#A6B6ED"/>
  <rect x="150" y="255" width="90" height="55" rx="16" fill="#C9D3F8"/>
  <rect x="250" y="255" width="90" height="55" rx="16" fill="#C9D3F8"/>
  <rect x="340" y="255" width="80" height="55" rx="16" fill="#C9D3F8"/>
  <!-- Sofa legs -->
  <rect x="135" y="378" width="10" height="18" rx="3" fill="#8C9AD6"/>
  <rect x="415" y="378" width="10" height="18" rx="3" fill="#8C9AD6"/>

  <!-- Throw cushions -->
  <rect x="170" y="300" width="46" height="46" rx="10" fill="#4F7CFF" transform="rotate(-6 193 323)"/>
  <rect x="340" y="305" width="46" height="46" rx="10" fill="#9B6BFF" transform="rotate(8 363 328)"/>

  <!-- Small potted plant on table -->
  <path d="M525 285 L555 285 L551 300 L529 300 Z" fill="#5FD9A4"/>
</svg>
