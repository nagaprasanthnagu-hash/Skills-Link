{% extends 'layouts/base.html' %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="container section">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card card-float p-4 p-md-5 animate-fade-up">
                <div class="text-center mb-4">
                    <div class="showcase-icon mx-auto" style="width:56px;height:56px;font-size:1.4rem;">
                        <i class="bi bi-shield-lock"></i>
                    </div>
                    <h1 class="h4 mt-3 mb-0">Change Password</h1>
                    <p class="text-muted-bookinghub mb-0">Enter your current password and choose a new one.</p>
                </div>

                <form method="post" data-loading-form>
                    {% csrf_token %}
                    {% include 'components/form_fields.html' with form=form %}

                    <div class="d-flex gap-2 mt-2">
                        <a href="{% url 'accounts:profile' %}" class="btn btn-outline-primary w-50">Cancel</a>
                        <button type="submit" class="btn btn-primary w-50">Change Password</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
