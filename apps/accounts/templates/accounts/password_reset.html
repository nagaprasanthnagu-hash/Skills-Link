{% extends 'layouts/auth_base.html' %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="auth-card animate-scale-in">
    <div class="card card-glass p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="showcase-icon mx-auto mb-3"><i class="bi bi-key"></i></div>
            <h1 class="h3 mb-1">Forgot Password</h1>
            <p class="text-muted-bookinghub mb-0">Enter your registered email and we'll send you a one-time password.</p>
        </div>
        <form method="post" data-loading-form>
            {% csrf_token %}
            {% include 'components/form_fields.html' with form=form %}
            <button type="submit" class="btn btn-primary w-100 mt-2">Send OTP</button>
        </form>
        <p class="text-center mt-4 mb-0 small"><a href="{% url 'accounts:login' %}">Back to login</a></p>
    </div>
</div>
{% endblock %}
