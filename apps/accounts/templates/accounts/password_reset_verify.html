{% extends 'layouts/auth_base.html' %}
{% block title %}Verify OTP{% endblock %}
{% block content %}
<div class="auth-card animate-scale-in">
    <div class="card card-glass p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="showcase-icon mx-auto mb-3"><i class="bi bi-shield-lock"></i></div>
            <h1 class="h3 mb-1">Verify OTP</h1>
            <p class="text-muted-bookinghub mb-0">Enter the 6-digit OTP sent to your email and choose a new password.</p>
        </div>
        <form method="post" data-loading-form>
            {% csrf_token %}
            {% include 'components/form_fields.html' with form=form %}
            <button type="submit" class="btn btn-primary w-100 mt-2">Reset Password</button>
        </form>
        <p class="text-center mt-4 mb-0 small"><a href="{% url 'accounts:password_reset' %}">Request a new OTP</a></p>
    </div>
</div>
{% endblock %}
