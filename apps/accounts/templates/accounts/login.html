{% extends 'layouts/auth_base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-card animate-scale-in">
    <div class="card card-glass p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="showcase-icon mx-auto mb-3"><i class="bi bi-box-arrow-in-right"></i></div>
            <h1 class="h3 mb-1">Welcome Back</h1>
            <p class="text-muted-bookinghub mb-0">Log in to manage your bookings.</p>
        </div>
        <form method="post" data-loading-form>
            {% csrf_token %}
            {% include 'components/form_fields.html' with form=form %}
            <button type="submit" class="btn btn-primary w-100 mt-2">Log In</button>
        </form>
        <div class="d-flex justify-content-between mt-4 small">
            <a href="{% url 'accounts:password_reset' %}">Forgot password?</a>
            <a href="{% url 'accounts:register' %}">Create an account</a>
        </div>
    </div>
</div>
{% endblock %}
