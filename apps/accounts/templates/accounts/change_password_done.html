{% extends 'layouts/base.html' %}
{% block title %}Password Changed{% endblock %}
{% block content %}
<div class="container section">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card card-float p-4 p-md-5 text-center animate-fade-up">
                <div class="showcase-icon mx-auto" style="width:56px;height:56px;font-size:1.4rem;background:var(--color-success);">
                    <i class="bi bi-check-lg"></i>
                </div>
                <h1 class="h4 mt-3 mb-2">Password Changed</h1>
                <p class="text-muted-bookinghub">Your password has been updated successfully. You're still signed in.</p>
                <a href="{% url 'accounts:profile' %}" class="btn btn-primary mt-2">Back to Profile</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
