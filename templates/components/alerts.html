{% if messages %}
    {% for message in messages %}
        <div class="alert alert-app alert-{{ message.tags }} alert-dismissible fade show animate-fade-up" role="alert" data-auto-dismiss>
            {% if message.tags == 'success' %}<i class="bi bi-check-circle-fill" aria-hidden="true"></i>{% elif message.tags == 'danger' or message.tags == 'error' %}<i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>{% else %}<i class="bi bi-info-circle-fill" aria-hidden="true"></i>{% endif %}
            <div class="alert-text">{{ message }}</div>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    {% endfor %}
{% endif %}
